<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOS ANUGRAH | TECH-RADAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010206; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; overflow-x: hidden; }

        /* Radar Animation */
        .radar { position: relative; width: 250px; height: 250px; border: 2px solid rgba(0, 242, 255, 0.2); border-radius: 50%; margin-bottom: 40px; }
        .radar::after { content: ""; position: absolute; width: 50%; height: 50%; background: linear-gradient(45deg, transparent, var(--neon)); top: 0; left: 0; transform-origin: bottom right; animation: scan 4s linear infinite; border-radius: 100% 0 0 0; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .title { color: var(--neon); text-shadow: 0 0 10px var(--neon); font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 3px; }

        /* Skill List */
        .skill-container { width: 100%; max-width: 400px; }
        .skill-item { margin-bottom: 20px; }
        .skill-info { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        .bar-bg { width: 100%; height: 8px; background: #111; border: 1px solid #222; position: relative; }
        .bar-fill { height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--neon); transition: 1s; }

        .footer { margin-top: auto; font-size: 0.6rem; color: #333; }
    </style>
</head>
<body>

    <div class="radar"></div>
    <h2 class="title">SKILL_INVENTORY_SCAN</h2>

    <div class="skill-container">
        <div class="skill-item">
            <div class="skill-info"><span>HTML_STRUCTURE</span><span>95%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: 95%;"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>CYBER_CSS_DESIGN</span><span>90%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: 90%;"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>JS_LOGIC_CORE</span><span>80%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>GITHUB_DEPLOYMENT</span><span>85%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: 85%;"></div></div>
        </div>
        <div class="skill-item">
            <div class="skill-info"><span>UI/UX_UX_HACKER</span><span>92%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width: 92%;"></div></div>
        </div>
    </div>

    <p style="margin-top: 30px; font-size: 0.7rem; color: var(--neon); opacity: 0.5;">STATUS: SCANNING_COMPLETE</p>
    
    <div class="footer">USER: BOS ANUGRAH // DATA_CENTER</div>

</body>
</html>
